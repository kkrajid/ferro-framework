# Ferro vs FastAPI vs Flask on a fresh GitHub runner (Feature 026): reproducible by anyone with
# the repository, from a release build, with pinned competitor versions. Results (Markdown with
# hardware and latency distribution, plus raw JSON) are the job summary and an artifact.
# Shared runners are noisy: compare runs on one runner, not across runs.
name: Benchmark

on:
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per run
        default: "10"
      rounds:
        description: Rounds (servers alternate)
        default: "3"
      connections:
        description: Concurrent connections
        default: "50"

permissions:
  contents: read

jobs:
  compare:
    name: Ferro vs FastAPI vs Flask (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: oha@1.16.0
      - name: Build the release wheel
        run: |
          python -m pip install --upgrade "pip>=26.2.2" "maturin>=1.15,<2"
          maturin build --release --out dist
      - name: Benchmark environment
        run: |
          python -m venv /tmp/bench
          /tmp/bench/bin/python -m pip install --upgrade "pip>=26.2.2"
          /tmp/bench/bin/python -m pip install --no-index --find-links dist ferro-framework
          /tmp/bench/bin/python -m pip install \
            "fastapi==0.156.5" "starlette==1.9.0" "uvicorn==0.54.0" "httptools==0.9.0" \
            "uvloop==0.21.0" "flask==3.1.3" "waitress==3.0.2" \
            "pydantic==2.14.1" "httpx==0.28.1"
          /tmp/bench/bin/python -m pip freeze
      - name: Run
        run: |
          /tmp/bench/bin/python tests/benchmarks/run_025_compare.py --uvloop \
            --seconds "${{ inputs.seconds }}" --rounds "${{ inputs.rounds }}" \
            --connections "${{ inputs.connections }}" --output results/compare.md
          cat results/compare.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        with:
          name: benchmark-results
          path: results/
