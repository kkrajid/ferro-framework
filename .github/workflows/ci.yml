name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  python:
    name: Python ${{ matrix.python }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v7
        with:
          cache-dependency-glob: "**/pyproject.toml"
      - uses: Swatinem/rust-cache@v2
      - run: uv venv --python ${{ matrix.python }} .venv
      - run: uv pip install --python .venv "maturin>=1.15,<2" "pytest>=8" "httpx>=0.27" "ruff>=0.6" "trustme>=1.1" "h2>=4" "pydantic>=2.7,<3"
      - run: uv run --python .venv ruff check python tests examples
      - run: uv run --python .venv ruff format --check python tests examples
      - run: uv run --python .venv maturin develop --uv
      - name: pytest
        shell: bash
        run: |
          set +e
          uv run --python .venv pytest -rfE 2>&1 | tee pytest.log
          status=${PIPESTATUS[0]}
          # Failures as annotations: visible on the run page and through the API without signing in.
          grep -E "^(FAILED|ERROR) " pytest.log | head -8 | while IFS= read -r line; do
            echo "::error title=pytest::${line}"
          done
          details=$(grep -E "^E  " pytest.log | head -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          if [ -n "$details" ]; then echo "::error title=pytest details::${details}"; fi
          exit $status

  postgres:
    name: ORM on PostgreSQL (ubuntu)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      FERRO_TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v7
        with:
          cache-dependency-glob: "**/pyproject.toml"
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: uv venv --python 3.13 .venv
      - run: uv pip install --python .venv "maturin>=1.15,<2" "pytest>=8" "httpx>=0.27"
      - run: uv run --python .venv maturin develop --uv
      - run: uv run --python .venv pytest tests/python/orm -k postgres
