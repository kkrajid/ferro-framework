[workspace]
resolver = "3"
members = [
  "crates/core",
  "crates/router",
  "crates/http",
  "crates/database",
  "crates/orm",
  "crates/sqlite",
  "crates/postgres",
  "crates/migrations",
  "crates/shared",
  "crates/python-bridge",
]

[workspace.package]
version = "0.5.0-rc.2"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kkrajid/ferro-framework"

[workspace.dependencies]
ferro-core = { path = "crates/core" }
ferro-router = { path = "crates/router" }
ferro-http = { path = "crates/http" }
ferro-database = { path = "crates/database" }
ferro-orm = { path = "crates/orm" }
ferro-sqlite = { path = "crates/sqlite" }
ferro-postgres = { path = "crates/postgres" }
ferro-migrations = { path = "crates/migrations" }
ferro-shared = { path = "crates/shared" }

actix-web = { version = "4.15", default-features = false }
actix-rt = "2"
actix-ws = "0.3"
argon2 = { version = "0.5", features = ["std"] }
async-channel = "2"
bytes = "1"
crossbeam-channel = "0.5"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
memmap2 = "0.9"
percent-encoding = "2"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
pyo3 = { version = "0.29", features = ["abi3-py312"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde_json = { version = "1", features = ["arbitrary_precision", "preserve_order"] }
socket2 = { version = "0.6", features = ["all"] }
tempfile = "3"
tokio = { version = "1", features = ["sync", "time"] }
tokio-postgres = "0.7"
tokio-postgres-rustls = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4"] }
webpki-roots = "1"

[workspace.lints.rust]
missing_debug_implementations = "warn"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

[profile.release]
lto = "fat"
codegen-units = 1

# Password hashing is deliberately expensive; keep it fast enough in debug builds.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
