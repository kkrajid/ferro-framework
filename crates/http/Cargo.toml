[package]
name = "ferro-http"
description = "HTTP engine adapter for the Ferro framework (the only crate that uses the HTTP engine)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ferro-core.workspace = true
ferro-router.workspace = true
ferro-shared.workspace = true
# `rustls-0_23` brings HTTP/2 (offered over TLS through ALPN).
actix-web = { workspace = true, features = ["rustls-0_23"] }
actix-rt.workspace = true
actix-ws.workspace = true
bytes.workspace = true
futures-util.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
serde_json.workspace = true
socket2.workspace = true
tempfile.workspace = true
# `rt`: spooled request bodies are written off the event loop (Feature 026).
tokio = { workspace = true, features = ["macros", "rt"] }
tracing.workspace = true

[lints]
workspace = true

[dev-dependencies]
rcgen.workspace = true
tokio = { workspace = true, features = ["time"] }
