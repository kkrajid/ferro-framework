# nginx in front of `ferro run --host 127.0.0.1 --port 8000` (set FERRO_TRUSTED_PROXIES=127.0.0.1).
# Certificates from certbot: `certbot --nginx -d example.com`.
upstream ferro {
    server 127.0.0.1:8000;
    keepalive 64;
}

server {
    listen 80;
    server_name example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    # Ferro enforces its own body limit (max_body_size); keep nginx's at least as large.
    client_max_body_size 2m;

    location / {
        proxy_pass http://ferro;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;     # above Ferro's request_timeout (30 s by default)
    }

    # Keep metrics internal (Ferro also restricts them to FERRO_METRICS_ALLOW).
    location = /metrics {
        return 404;
    }
}
