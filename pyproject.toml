[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "ferro-framework"
description = "Python application framework with a Rust-native execution engine"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE", "THIRD-PARTY-LICENSES.txt"]
dynamic = ["version"]
keywords = ["web", "framework", "orm", "async", "rust", "http"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
    "Topic :: Database",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/kkrajid/ferro-framework"
Documentation = "https://github.com/kkrajid/ferro-framework/blob/main/docs/README.md"
Changelog = "https://github.com/kkrajid/ferro-framework/blob/main/CHANGELOG.md"
Issues = "https://github.com/kkrajid/ferro-framework/issues"

[project.optional-dependencies]
# Request bodies and responses as Pydantic models (Feature 019).
pydantic = ["pydantic>=2.7,<3"]

[project.scripts]
ferro = "ferro.cli:main"

[dependency-groups]
dev = [
    "maturin>=1.15,<2", "pytest>=8", "httpx>=0.27", "ruff>=0.6", "trustme>=1.1", "h2>=4",
    "pydantic>=2.7,<3",
]

[tool.maturin]
manifest-path = "crates/python-bridge/Cargo.toml"
module-name = "ferro._ferro"
python-source = "python"
# Only the package and its native module go into wheels (no debug symbols on Windows).
exclude = ["python/ferro/**/*.pdb", "python/ferro/**/__pycache__/**"]

[tool.pytest.ini_options]
testpaths = ["tests/python", "tests/integration", "tests/stress"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["python", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
